<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abfahrten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1013;
    --panel:#151a1f;
    --rule:#252d35;
    --ink:#eef2f5;
    --dim:#8794a0;
    --wl:#e2231a;
    --sbahn:#0d6ab5;
    --bus:#1a8b8b;
    --late:#f0a202;
    --go:#33b072;
    --font-d:"IBM Plex Sans Condensed",system-ui,sans-serif;
    --font-m:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{height:100%}
  body{
    min-height:100%;
    background:var(--bg);color:var(--ink);font-family:var(--font-d);
    display:flex;flex-direction:column;overflow-x:hidden;overflow-y:auto;
    -webkit-user-select:none;user-select:none;
  }
  header{
    position:sticky;top:0;z-index:5;background:var(--bg);
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px 10px;border-bottom:1px solid var(--rule);
  }
  header .clock{font-family:var(--font-m);font-size:34px;font-weight:600;letter-spacing:-.02em}
  header .status{font-size:13px;color:var(--dim);flex:1;text-align:right}
  header .clock{flex:1}
  .wx{display:flex;align-items:center;gap:10px;font-family:var(--font-m);font-size:30px;font-weight:600}
  .wx svg{width:40px;height:40px}
  .wx .sun{fill:#f5c542}.wx .moon{fill:#d9dee4}.wx .cloud{fill:#aeb8c2}.wx .drop{fill:#5aa9e6}
  .wx .snow{fill:#e8f1f8}.wx .bolt{fill:#f5c542}.wx .fog{stroke:#aeb8c2;stroke-width:3;stroke-linecap:round}
  main{flex:1 0 auto;display:grid;gap:1px;background:var(--rule)}
  section{background:var(--panel);display:flex;flex-direction:column;min-height:0}
  .head{display:flex;align-items:center;gap:10px;padding:12px 18px 8px}
  .head h2{font-size:22px;font-weight:700;letter-spacing:.01em}
  .head .tag{font-size:12px;color:var(--dim);font-family:var(--font-m);text-transform:uppercase;letter-spacing:.08em}
  .rows{flex:1;overflow:hidden;padding:0 12px 12px}
  .row{
    display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:center;gap:12px;
    padding:10px 6px;border-bottom:1px solid rgba(255,255,255,.05);
  }
  .row > div{min-width:0}
  .cd{white-space:nowrap}
  .badge{
    font-weight:700;font-size:20px;text-align:center;border-radius:5px;
    padding:5px 4px;background:#333c45;color:#fff;line-height:1;
  }
  .badge.metro{background:var(--wl)}
  .badge.tram{background:var(--wl)}
  .badge.bus{background:var(--bus)}
  .badge.rail{background:var(--sbahn)}
  .badge.dir-in{background:var(--sbahn)}      /* stadteinwaerts */
  .badge.dir-out{background:#2f7d5f}          /* stadtauswaerts */
  .towards{font-size:21px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta{font-size:13px;color:var(--dim);font-family:var(--font-m);margin-top:2px}
  .meta .delay{color:var(--late)}
  .cd{font-family:var(--font-m);font-size:32px;font-weight:600;text-align:right;letter-spacing:-.03em}
  .cd small{font-size:14px;color:var(--dim);margin-left:3px;font-weight:400}
  .cd.soon{color:var(--late)}
  .row.combo{grid-template-columns:64px minmax(0,1fr) auto}
  .row.combo .cd{font-size:27px}
  .row.combo .cd .sep{color:var(--dim);margin:0 5px;font-weight:400}
  .row.plan .cd{color:var(--dim);font-weight:400}
  .row.plan .towards{color:#c3ccd4}
  .chip{
    font-family:var(--font-m);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    background:#3a444e;color:#dbe3ea;border-radius:3px;padding:2px 6px;margin-left:9px;
    position:relative;top:-2px;
  }
  .notice{
    margin:2px 6px 8px;padding:7px 10px;border-left:3px solid var(--wl);
    background:rgba(226,35,26,.10);font-size:14px;line-height:1.35;color:#f1d3d1;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .notice b{color:#fff;font-weight:600}
  .banner.warn{border-left-color:var(--late);background:rgba(240,162,2,.10);color:#e8c07a}
  .banner{
    display:flex;align-items:center;gap:8px;margin:2px 6px 8px;padding:7px 10px;
    border-left:3px solid var(--dim);background:rgba(135,148,160,.10);
    font-size:13px;color:var(--dim);font-family:var(--font-m);
  }
  .note{padding:14px 18px;font-size:15px;color:var(--dim);line-height:1.45}
  .note code{font-family:var(--font-m);font-size:13px;color:#b9c4cf;word-break:break-all}
  @media (orientation:portrait),(max-width:760px){
    main{grid-template-columns:minmax(0,1fr) !important;grid-auto-rows:min-content;align-content:start}
    main{background:var(--bg);gap:0}
    section{border-bottom:1px solid var(--rule)}
    .rows{padding-bottom:6px}
  }
  /* Handy und andere schmale Bildschirme */
  @media (max-width:520px){
    header{padding:10px 14px 8px}
    header .clock{font-size:26px}
    header .status{font-size:11px}
    .wx{font-size:22px;gap:6px}
    .wx svg{width:30px;height:30px}
    .head{padding:10px 12px 6px;flex-wrap:wrap;gap:4px 10px}
    .head h2{font-size:18px}
    .rows{padding:0 8px 8px}
    .row,.row.combo{grid-template-columns:48px minmax(0,1fr) auto;gap:8px;padding:8px 4px}
    .badge{font-size:15px;padding:4px 2px}
    .towards{font-size:17px}
    .meta{font-size:11px}
    .cd,.row.combo .cd{font-size:22px}
    .cd small{font-size:11px}
    .row.combo .cd .sep{margin:0 3px}
    .notice{font-size:12.5px;margin:2px 4px 6px}
    .chip{font-size:10px;margin-left:6px}
  }
  .row.best{box-shadow:inset 4px 0 0 var(--go);background:rgba(51,176,114,.08)}
  .conn{font-size:13px;color:#9fd9b8;font-family:var(--font-m);margin-top:2px;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conn span{color:var(--dim)}
  .row.best .conn{color:var(--go);font-weight:600}
  .row .cd .pick{color:var(--go)}
  @media (max-width:520px){ .conn{font-size:11px} .conn span{display:none} }
</style>
</head>
<body>
<header>
  <div class="clock" id="clock">--:--</div>
  <div class="wx" id="wx"></div>
  <div class="status" id="status">wird geladen</div>
</header>
<main id="panels"></main>

<script src="config.js" charset="utf-8"></script>
<script>
/* Programmteil. Alle Einstellungen stehen in config.js. */

if (typeof CONFIG === "undefined") {
  document.getElementById("panels").innerHTML =
    '<div class="note" style="padding:24px">config.js fehlt oder enthält einen Fehler ' +
    '(z. B. fehlender Beistrich oder Anführungszeichen). Bitte die Datei prüfen.</div>';
  document.getElementById("status").textContent = "Konfiguration fehlt";
  throw new Error("config.js fehlt oder ist fehlerhaft");
}

const WL_CSV = "https://www.wienerlinien.at/ogd_realtime/doku/ogd/wienerlinien-ogd-haltepunkte.csv";
const WL_MON = "https://www.wienerlinien.at/ogd_realtime/monitor";
// ÖBB: Scotty-Liveticker, beides GET. mgate.exe scheidet aus, Fully verarbeitet
// bei aktiver CORS-Ausnahme keine POST-Anfragen.
const SCOTTY_STOP = "https://fahrplan.oebb.at/bin/ajax-getstop.exe/dn";
const SCOTTY_BOARD = "https://fahrplan.oebb.at/bin/stboard.exe/dn";
const REST_PATHS = ["/api", ""];

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const hhmm = d => pad(d.getHours()) + ":" + pad(d.getMinutes());
const state = {};                   // je Panel: rows, err, aufgeloeste IDs

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function unhtml(v) {
  const t = document.createElement("textarea");
  t.innerHTML = String(v == null ? "" : v).replace(/<[^>]*>/g, "");
  return t.value.trim();
}
function applyFilters(p, list) {
  const line = p.line ? new RegExp(p.line, "i") : null;
  const tow = p.towards ? new RegExp(p.towards, "i") : null;
  const kept = list.filter(d => (!line || line.test(d.line)) && (!tow || tow.test(d.towards)));
  // Fuer den Fall, dass ein Filter alles wegwirft: Richtungen merken
  if (state[p.id]) {
    state[p.id].available = [...new Set(list.map(d => d.line + " nach " + d.towards))].slice(0, 8);
  }
  return kept;
}

/* ---------- Wiener Linien ---------- */

let wlCsv = null;

async function wlStopIds(name) {
  if (!wlCsv) {
    const res = await fetch(WL_CSV, { cache: "no-store" });
    if (!res.ok) throw new Error("Haltepunktliste HTTP " + res.status);
    wlCsv = new TextDecoder("utf-8").decode(await res.arrayBuffer());
  }
  const want = name.toLowerCase();
  const ids = [];
  for (const line of wlCsv.split(/\r?\n/).slice(1)) {
    const c = line.split(";");
    if (c.length < 3) continue;
    if (c[2].trim().toLowerCase().includes(want)) ids.push(c[0].trim());
  }
  if (!ids.length) throw new Error('Keine Haltepunkte fuer "' + name + '"');
  return ids;
}

function wlDepartures(json) {
  const out = [];
  for (const m of (json?.data?.monitors || [])) {
    const rbl = m?.locationStop?.properties?.attributes?.rbl || m?.locationStop?.properties?.name || "";
    for (const line of (m.lines || [])) {
      for (const dep of (line.departures?.departure || [])) {
        const t = dep.departureTime || {};
        const planned = t.timePlanned ? new Date(t.timePlanned) : null;
        const at = t.timeReal ? new Date(t.timeReal) : planned;
        if (!at) continue;
        out.push({
          line: line.name,
          towards: (line.towards || "").trim(),
          kind: line.type === "ptMetro" ? "metro" : line.type === "ptTram" ? "tram" : "bus",
          at: at, planned: planned, live: !!t.timeReal, platform: "", rbl: rbl
        });
      }
    }
  }
  return out;
}

async function wlMonitor(ids, extra) {
  const url = WL_MON + "?" + ids.map(id => "stopId=" + encodeURIComponent(id)).join("&") + (extra || "");
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error("Monitor HTTP " + res.status);
  return res.json();
}

// Fahrzeit je Bus messen: dieselbe Linie an der Zielhaltestelle, erste
// planmaessige Abfahrt nach der hiesigen. Fahrzeit = Echtzeit dort minus
// Echtzeit hier. Faellt die Messung unplausibel aus, bleibt der Ersatzwert.
const norm = v => String(v || "").toLowerCase().replace(/[^a-z0-9äöüß]/g, "");

function measureRides(rows, target) {
  for (const d of rows) {
    const ref = d.planned || d.at;
    let best = null;
    for (const t of target) {
      if (t.line !== d.line) continue;
      if (norm(t.towards) !== norm(d.towards)) continue;   // nur gleiche Fahrtrichtung
      const tref = t.planned || t.at;
      const gap = (tref - ref) / 60000;
      if (gap <= 0 || gap > 15) continue;
      if (!best || tref < (best.planned || best.at)) best = t;
    }
    if (!best) continue;
    const real = Math.round((best.at - d.at) / 60000);
    const plan = Math.round(((best.planned || best.at) - ref) / 60000);
    d.ride = real > 0 && real <= 20 ? real : plan;
  }
}

async function loadWl(p) {
  const st = state[p.id];
  if (!st.ids) st.ids = p.stopIds && p.stopIds.length ? p.stopIds : await wlStopIds(p.stop);
  const json = await wlMonitor(st.ids,
    p.trafficInfo ? "&activateTrafficInfo=stoerungkurz&activateTrafficInfo=stoerunglang" : "");
  const rows = applyFilters(p, wlDepartures(json)).sort((a, b) => a.at - b.at);

  // Fahrzeit bis zur Umsteigehaltestelle messen (eigener Abruf, Fehler egal)
  if (p.connect && p.connect.rideStopIds && p.connect.rideStopIds.length) {
    try { measureRides(rows, wlDepartures(await wlMonitor(p.connect.rideStopIds))); }
    catch (e) { /* Ersatzwert rideMinutes greift */ }
  }

  // Stoerungsmeldungen: nur solche, die eine Linie dieses Kastens betreffen
  st.notices = [];
  if (p.trafficInfo) {
    const mine = new Set(rows.map(d => String(d.line).toUpperCase()));
    for (const t of (json?.data?.trafficInfos || [])) {
      const lines = (t.relatedLines || []).map(l => String(l).toUpperCase());
      const hit = lines.filter(l => mine.has(l));
      if (!hit.length) continue;
      const text = unhtml(t.title || t.name || "") ;
      const desc = unhtml(t.description || "");
      st.notices.push({ lines: hit.join(", "), text: text || desc, desc: text ? desc : "" });
    }
  }
  return rows;
}

/* ---------- OeBB: Scotty-Liveticker (GET) ---------- */

// Antworten sind in JS-Zuweisungen verpackt: "obj = {...};", Kodierung nicht dokumentiert.
async function scotty(url) {
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error("Scotty HTTP " + res.status);
  const buf = await res.arrayBuffer();
  let text;
  try { text = new TextDecoder("utf-8", { fatal: true }).decode(buf); }
  catch (e) { text = new TextDecoder("iso-8859-1").decode(buf); }
  const a = text.indexOf("{"), b = text.lastIndexOf("}");
  if (a < 0 || b < a) throw new Error("Scotty: unerwartete Antwort");
  return JSON.parse(text.slice(a, b + 1));
}

async function scottyStopId(query) {
  const json = await scotty(SCOTTY_STOP + "?REQ0JourneyStopsS0A=1&REQ0JourneyStopsB=12&js=true" +
                            "&S=" + encodeURIComponent(query));
  const hit = (json.suggestions || []).find(x => x.extId) || (json.suggestions || [])[0];
  if (!hit) throw new Error('Station "' + query + '" nicht gefunden');
  return hit.extId || hit.id;
}

const ddmmyyyy = d => pad(d.getDate()) + "." + pad(d.getMonth() + 1) + "." + d.getFullYear();

function scottyWhen(da, ti) {
  const dm = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(da || "");
  const tm = /^(\d{1,2}):(\d{2})$/.exec(ti || "");
  if (!dm || !tm) return null;
  return new Date(+dm[3], +dm[2] - 1, +dm[1], +tm[1], +tm[2], 0);
}

async function scottyBoard(p, stopId, products) {
  const now = new Date();
  return scotty(SCOTTY_BOARD + "?L=vs_scotty.vs_liveticker&outputMode=tickerDataOnly&start=yes" +
    "&boardType=dep&evaId=" + encodeURIComponent(stopId) +
    "&productsFilter=" + products +
    "&maxJourneys=" + (p.fetchJourneys || 40) +
    "&additionalTime=0&selectDate=period" +
    "&time=" + pad(now.getHours()) + "%3A" + pad(now.getMinutes()) +
    "&dateBegin=" + ddmmyyyy(now) + "&dateEnd=" + ddmmyyyy(now));
}

async function loadScotty(p) {
  const st = state[p.id];
  if (!st.stopId) st.stopId = p.stopId || await scottyStopId(p.query);
  const wanted = p.products || "1111111111111111";
  let json = await scottyBoard(p, st.stopId, wanted);
  // Bitmaske ist nicht dokumentiert: liefert sie nichts, ungefiltert nachfassen
  if (!(json.journey || []).length && wanted !== "1111111111111111") {
    json = await scottyBoard(p, st.stopId, "1111111111111111");
  }
  // Die Tafel meldet mit rtInfo, ob die Station ueberhaupt Echtzeit liefert.
  // Ist das der Fall, bedeutet ein fehlendes rt-Objekt "keine Abweichung",
  // also puenktlich, und nicht "keine Daten".
  const boardRt = json.rtInfo === true;
  const skip = p.skip ? new RegExp(p.skip, "i") : null;
  const seen = new Set();
  const out = [];
  for (const j of (json.journey || [])) {
    const rt = j.rt && typeof j.rt === "object" ? j.rt : null;
    if (rt && /ausf|entf|cancel/i.test(String(rt.status || ""))) continue;
    const name = unhtml(j.pr) || "Zug";
    if (skip && skip.test(name)) continue;
    const planned = scottyWhen(j.da, j.ti);
    const at = rt && rt.dlt ? scottyWhen(rt.dld || j.da, rt.dlt) : planned;
    if (!at) continue;
    const key = (j.id || "") + "|" + at.getTime();
    if (seen.has(key)) continue;
    seen.add(key);
    out.push({
      line: name, towards: unhtml(j.st), kind: "rail",
      at: at, planned: planned, live: !!rt || boardRt, platform: unhtml(j.tr)
    });
  }
  return applyFilters(p, out).sort((a, b) => a.at - b.at);
}

/* ---------- Ausweichquelle: REST-Huelle (GET) ---------- */

let restPath = null;

async function rest(suffix) {
  const paths = restPath === null ? REST_PATHS : [restPath];
  let last = null;
  for (const pth of paths) {
    try {
      const res = await fetch(CONFIG.restBase + pth + suffix, { cache: "no-store" });
      if (!res.ok) { last = new Error("HTTP " + res.status); continue; }
      const json = await res.json();
      restPath = pth;
      return json;
    } catch (e) { last = e; }
  }
  throw last || new Error("REST nicht erreichbar");
}

async function loadRest(p) {
  const loc = await rest("/locations?query=" + encodeURIComponent(p.query) + "&results=5");
  const locs = Array.isArray(loc) ? loc : (loc.locations || []);
  const hit = locs.find(l => (l.type === "stop" || l.type === "station") && l.id) || locs[0];
  if (!hit || !hit.id) throw new Error("Station nicht gefunden");
  const json = await rest("/stops/" + encodeURIComponent(hit.id) + "/departures?duration=120&results=" +
                          ((p.maxRows || 6) + 8));
  const list = Array.isArray(json) ? json : (json.departures || []);
  // Die Tafel meldet mit rtInfo, ob die Station ueberhaupt Echtzeit liefert.
  // Ist das der Fall, bedeutet ein fehlendes rt-Objekt "keine Abweichung",
  // also puenktlich, und nicht "keine Daten".
  const boardRt = json.rtInfo === true;
  const skip = p.skip ? new RegExp(p.skip, "i") : null;
  const out = [];
  for (const d of list) {
    if (d.cancelled === true) continue;
    const when = d.when || d.plannedWhen;
    if (!when) continue;
    const name = (d.line && (d.line.name || d.line.id)) || "Zug";
    if (skip && skip.test(name)) continue;
    out.push({
      line: name, towards: d.direction || "", kind: "rail",
      at: new Date(when), planned: d.plannedWhen ? new Date(d.plannedWhen) : null,
      live: typeof d.delay === "number", platform: d.platform || d.plannedPlatform || ""
    });
  }
  return applyFilters(p, out).sort((a, b) => a.at - b.at);
}

async function loadPanel(p) {
  if (p.source === "wl") return loadWl(p);
  try { return await loadScotty(p); }
  catch (e) {
    try { return await loadRest(p); }
    catch (e2) { throw new Error("Scotty: " + e.message + " | REST: " + e2.message); }
  }
}

/* ---------- Wetter (Open-Meteo) ---------- */

const WX_ICONS = {
  sun:   '<circle class="sun" cx="24" cy="24" r="9"/><g class="sun">' +
         [0,45,90,135,180,225,270,315].map(a => '<rect x="22.5" y="3" width="3" height="7" rx="1.5" transform="rotate(' + a + ' 24 24)"/>').join("") + '</g>',
  moon:  '<path class="moon" d="M30 8a16 16 0 1 0 10 26A13 13 0 0 1 30 8z"/>',
  cloud: '<path class="cloud" d="M14 36h22a8 8 0 0 0 0-16 11 11 0 0 0-21-2A9 9 0 0 0 14 36z"/>',
  part:  null, rain: null, snow: null, storm: null, fog: null
};
WX_ICONS.partDay   = '<g transform="scale(.7)">' + WX_ICONS.sun + '</g>' + '<g transform="translate(4 6) scale(.85)">' + WX_ICONS.cloud + '</g>';
WX_ICONS.partNight = '<g transform="translate(1 0) scale(.7)">' + WX_ICONS.moon + '</g>' + '<g transform="translate(4 6) scale(.85)">' + WX_ICONS.cloud + '</g>';
WX_ICONS.rain  = '<g transform="translate(0 -6)">' + WX_ICONS.cloud + '</g><path class="drop" d="M16 36l-3 7h3l3-7zM24 36l-3 7h3l3-7zM32 36l-3 7h3l3-7z"/>';
WX_ICONS.snow  = '<g transform="translate(0 -6)">' + WX_ICONS.cloud + '</g><circle class="snow" cx="16" cy="39" r="2.4"/><circle class="snow" cx="24" cy="43" r="2.4"/><circle class="snow" cx="32" cy="39" r="2.4"/>';
WX_ICONS.storm = '<g transform="translate(0 -6)">' + WX_ICONS.cloud + '</g><path class="bolt" d="M25 31l-7 10h5l-3 7 9-11h-5l3-6z"/>';
WX_ICONS.fog   = '<path class="fog" d="M10 18h28M6 26h36M10 34h28M14 42h20" fill="none"/>';

// WMO-Wettercode nach Symbol
function wxIcon(code, isDay) {
  if (code === 0 || code === 1) return isDay ? WX_ICONS.sun : WX_ICONS.moon;
  if (code === 2) return isDay ? WX_ICONS.partDay : WX_ICONS.partNight;
  if (code === 3) return WX_ICONS.cloud;
  if (code === 45 || code === 48) return WX_ICONS.fog;
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return WX_ICONS.snow;
  if (code >= 95) return WX_ICONS.storm;
  if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return WX_ICONS.rain;
  return WX_ICONS.cloud;
}

let wxLast = 0;

async function refreshWeather(force) {
  const w = CONFIG.weather;
  if (!w || (!force && inQuietHours())) return;
  if (!force && Date.now() - wxLast < (w.everyMinutes || 10) * 60000) return;
  try {
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + w.lat + "&longitude=" + w.lon +
                "&current=temperature_2m,weather_code,is_day&timezone=Europe%2FVienna";
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const c = (await res.json()).current || {};
    if (typeof c.temperature_2m !== "number") throw new Error("keine Temperatur");
    wxLast = Date.now();
    $("wx").innerHTML = '<svg viewBox="0 0 48 48" aria-hidden="true">' + wxIcon(c.weather_code, c.is_day === 1) + '</svg>' +
      '<span>' + Math.round(c.temperature_2m).toLocaleString("de-AT") + '°C</span>';
  } catch (e) {
    // Wetter ist Beiwerk: bei Fehler alten Wert stehen lassen, nichts melden
  }
}

/* ---------- Anschluss Bus an S-Bahn ---------- */

// Ersatzwert der Fahrzeit: Zahl fuer alle Linien oder Liste je Linie
function rideEstimate(c, line) {
  const r = c.rideMinutes;
  if (typeof r === "number") return r;
  if (r && typeof r === "object") {
    const v = r[line] != null ? r[line] : r[String(line).toUpperCase()];
    return typeof v === "number" ? v : (typeof r.other === "number" ? r.other : 0);
  }
  return 0;
}

function connectionFor(p, bus) {
  const c = p.connect;
  const target = CONFIG.panels.find(x => x.id === c.panel);
  if (!target || !state[target.id] || !state[target.id].rows) return null;
  const pattern = c.towards || target.outbound || "";
  const re = pattern ? new RegExp(pattern, "i") : null;
  const ride = typeof bus.ride === "number" ? bus.ride : rideEstimate(c, bus.line);
  const ready = bus.at.getTime() + (ride + (c.transferMinutes || 0)) * 60000;
  return state[target.id].rows.find(t => (!re || re.test(t.towards)) && t.at.getTime() >= ready) || null;
}

/* ---------- Aufbau und Rendering ---------- */

function buildPanels() {
  $("panels").style.gridTemplateColumns = "repeat(" + CONFIG.panels.length + ", minmax(0, 1fr))";
  $("panels").innerHTML = CONFIG.panels.map(p =>
    '<section><div class="head"><h2>' + escapeHtml(p.title) + '</h2>' +
    '<span class="tag">' + escapeHtml(p.tag || "") + '</span></div>' +
    '<div class="rows" id="rows-' + p.id + '"><div class="note">wird geladen</div></div></section>'
  ).join("");
  for (const p of CONFIG.panels) state[p.id] = { rows: [], err: null };
}

function renderPanel(p) {
  const box = $("rows-" + p.id);
  const st = state[p.id];
  if (st.err && !(st.rows && st.rows.length)) {
    const blocked = st.err instanceof TypeError || /failed to fetch|load failed|networkerror/i.test(st.err.message);
    box.innerHTML = '<div class="note">Keine Daten.<br><code>' + escapeHtml(st.err.message) + '</code><br><br>' +
      (blocked
        ? 'Der Browser hat die Anfrage blockiert (CORS) oder die Gegenstelle ist nicht erreichbar.'
        : 'Die Gegenstelle hat geantwortet, aber mit einem Fehler. Kein CORS-Problem.') + '</div>';
    return;
  }
  const now = Date.now();
  const due = st.rows
    .map(d => ({ ...d, min: Math.round((d.at - now) / 60000) }))
    .filter(d => d.min >= (typeof p.hideBelowMinutes === "number" ? p.hideBelowMinutes : CONFIG.hideBelowMinutes) && d.min < 120);

  // combine: mehrere Abfahrten derselben Linie und Richtung in eine Zeile
  let items;
  if (p.combine > 1) {
    const map = new Map();                // je Linie und Richtung sammeln,
    for (const d of due) {                // dann in Bloecke zu p.combine teilen
      const key = d.line + "|" + d.towards;
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(d);
    }
    items = [];
    for (const list of map.values()) {
      let taken = 0;
      for (let i = 0; i < list.length; i += p.combine) {
        if (p.rowsPerLine && taken >= p.rowsPerLine) break;
        const chunk = list.slice(i, i + p.combine);
        items.push({ line: chunk[0].line, towards: chunk[0].towards, kind: chunk[0].kind, entries: chunk });
        taken++;
      }
    }
    items.sort((a, b) => a.entries[0].at - b.entries[0].at);
  } else if (p.rowsPerLine) {
    const count = new Map();
    items = [];
    for (const d of due) {
      const key = d.line + "|" + d.towards;
      const n = count.get(key) || 0;
      if (n >= p.rowsPerLine) continue;
      count.set(key, n + 1);
      items.push({ line: d.line, towards: d.towards, kind: d.kind, entries: [d] });
    }
  } else {
    items = due.map(d => ({ line: d.line, towards: d.towards, kind: d.kind, entries: [d] }));
  }
  items = items.slice(0, p.maxRows || 6);

  // Anschluss an die S-Bahn: fruehester erreichbarer Zug Richtung Sueden,
  // markiert wird der spaeteste Bus, der ihn noch erreicht.
  let pick = null, pickTrain = null;
  if (p.connect && state[p.connect.panel]) state[p.connect.panel].connTrain = null;
  if (p.connect && inWindow(p.connect.showFrom, p.connect.showUntil)) {
    const walk = p.connect.walkMinutes || 0;
    for (const d of due) {
      if (d.min < walk) continue;                    // zu Fuss nicht mehr erreichbar
      const t = connectionFor(p, d);
      if (!t) continue;
      const earlier = !pickTrain || t.at < pickTrain.at;
      const sameLater = pickTrain && t.at.getTime() === pickTrain.at.getTime() && d.at > pick.at;
      if (earlier || sameLater) { pick = d; pickTrain = t; }
    }
    // Zug im S-Bahn-Kasten mit gruenem Balken kennzeichnen
    if (pickTrain && state[p.connect.panel]) state[p.connect.panel].connTrain = pickTrain;
  }
  const ct = st.connTrain;
  const isConnTrain = d => ct && d.line === ct.line && d.towards === ct.towards &&
                           d.at.getTime() === ct.at.getTime();

  // Warnhinweise. In der Nachtpause unterdrueckt, dort ist Stillstand gewollt.
  const warns = [];
  if (!inQuietHours()) {
    const ageMin = t => Math.round((Date.now() - t) / 60000);
    if (st.err) warns.push("Aktualisierung fehlgeschlagen, Anzeige eingefroren");
    else if (st.lastOk && ageMin(st.lastOk) >= CONFIG.staleMinutes)
      warns.push("Letzter Abruf um " + hhmm(new Date(st.lastOk)));
    if (!st.err && st.lastChange && ageMin(st.lastChange) >= CONFIG.frozenMinutes)
      warns.push("Tafel unveraendert seit " + hhmm(new Date(st.lastChange)));
  }
  const warnHtml = warns.map(w => '<div class="banner warn">' + escapeHtml(w) + '</div>').join("") +
    (st.notices || []).slice(0, 2).map(n =>
      '<div class="notice"><b>' + escapeHtml(n.lines) + ':</b> ' + escapeHtml(n.text) +
      (n.desc ? " - " + escapeHtml(n.desc) : "") + '</div>').join("");

  if (!items.length) {
    const hint = (p.line || p.towards) && st.available && st.available.length
      ? '<br><br>Der Filter hat alles verworfen. Vorhanden waren:<br><code>' +
        st.available.map(escapeHtml).join('<br>') + '</code>'
      : "";
    box.innerHTML = warnHtml + '<div class="note">Derzeit keine Abfahrten.' + hint + '</div>';
    return;
  }

  const mark = p.planMark !== false;      // Soll-Kennzeichnung je Panel abschaltbar
  const anyLive = items.some(g => g.entries.some(d => d.live));
  const banner = !mark || anyLive ? "" : '<div class="banner">Soll-Fahrplan, keine Echtzeitdaten</div>';
  const outbound = p.outbound ? new RegExp(p.outbound, "i") : null;
  const inbound = p.inbound ? new RegExp(p.inbound, "i") : null;

  box.innerHTML = warnHtml + banner + items.map(g => {
    const dir = outbound ? (outbound.test(g.towards) ? " dir-out" : " dir-in")
              : inbound ? (inbound.test(g.towards) ? " dir-in" : " dir-out") : "";
    const allPlan = g.entries.every(d => !d.live);

    const meta = g.entries.map(d => {
      const delay = d.planned ? Math.round((d.at - d.planned) / 60000) : 0;
      return hhmm(d.at) + (d.live && delay > 0 ? ' <span class="delay">+' + delay + '</span>' : "");
    }).join(" &middot; ") +
      (g.entries[0].platform ? " &middot; Bstg. " + escapeHtml(g.entries[0].platform) : "") +
      (CONFIG.showRbl && g.entries[0].rbl ? " &middot; RBL " + escapeHtml(g.entries[0].rbl) : "");

    const hasBus = pick && g.entries.includes(pick);
    const hasPick = hasBus || g.entries.some(isConnTrain);
    let connHtml = "";
    if (hasBus) {
      const measured = typeof pick.ride === "number";
      const ride = measured ? pick.ride : rideEstimate(p.connect, pick.line);
      const arr = pick.at.getTime() + ride * 60000;
      const slack = Math.round((pickTrain.at.getTime() - arr) / 60000);
      connHtml = '<div class="conn">Anschluss ' + hhmm(pickTrain.at) + ' ' + escapeHtml(pickTrain.line) + ' ' +
                 escapeHtml(pickTrain.towards) +
                 ' <span>(Fahrt ' + ride + (measured ? "" : " geschätzt") + ', Umstieg ' + slack + ' min)</span></div>';
    }

    const soon = g.entries[0].live && g.entries[0].min <= 3;
    const cd = g.entries.map(d => d === pick ? '<span class="pick">' + d.min + '</span>' : d.min)
                        .join('<span class="sep">&middot;</span>');

    return '<div class="row' + (g.entries.length > 1 ? " combo" : "") +
      (allPlan && mark ? " plan" : "") + (hasPick ? " best" : "") + '">' +
      '<div class="badge ' + g.kind + dir + '">' + escapeHtml(g.line) + '</div>' +
      '<div><div class="towards">' + escapeHtml(g.towards) +
      (allPlan && mark ? '<span class="chip">Soll</span>' : "") + '</div>' +
      '<div class="meta">' + meta + '</div></div>' +
      '<div class="cd' + (soon ? " soon" : "") + '">' + cd + '<small>min</small></div>' +
      '</div>';
  }).join("");
}

function tick() {
  $("clock").textContent = hhmm(new Date());
  CONFIG.panels.forEach(renderPanel);
}

// "05:30" oder 5 oder 5.5 in Minuten seit Mitternacht
function dayMinutes(v) {
  if (typeof v === "number") return Math.round(v * 60);
  const m = /^(\d{1,2})(?::(\d{2}))?$/.exec(String(v || "").trim());
  return m ? (+m[1]) * 60 + (+(m[2] || 0)) : null;
}

// true, wenn die aktuelle Uhrzeit im Fenster [from, until) liegt.
// Fehlt eine Grenze, gilt das Fenster als offen.
function inWindow(from, until) {
  const f = from == null ? 0 : dayMinutes(from), u = until == null ? 1440 : dayMinutes(until);
  if (f === null || u === null) return true;
  const d = new Date(), t = d.getHours() * 60 + d.getMinutes();
  return f <= u ? (t >= f && t < u) : (t >= f || t < u);
}

function inQuietHours() {
  const q = CONFIG.quietHours;
  if (!q) return false;
  const from = dayMinutes(q.from), to = dayMinutes(q.to);
  if (from === null || to === null || from === to) return false;
  const d = new Date(), t = d.getHours() * 60 + d.getMinutes();
  return from < to ? (t >= from && t < to) : (t >= from || t < to);
}

async function refresh() {
  if (inQuietHours()) {
    const to = dayMinutes(CONFIG.quietHours.to);
    $("status").textContent = "Abruf pausiert bis " + pad(Math.floor(to / 60)) + ":" + pad(to % 60);
    tick();
    return;
  }
  const results = await Promise.allSettled(CONFIG.panels.map(loadPanel));
  const stamp = Date.now();
  results.forEach((r, i) => {
    const st = state[CONFIG.panels[i].id];
    if (r.status === "fulfilled") {
      st.rows = r.value;
      st.err = null;
      st.lastOk = stamp;
      // Signatur des Tafelinhalts: aendert sie sich nicht mehr, steht die Quelle
      const sig = r.value.map(d => d.line + "@" + d.at.getTime()).join(",");
      if (sig !== st.sig) { st.sig = sig; st.lastChange = stamp; }
    } else {
      st.err = r.reason;      // alte Zeilen bleiben stehen, siehe renderPanel
    }
  });
  const bad = CONFIG.panels.filter(p => state[p.id].err).length;
  $("status").textContent = "Stand " + hhmm(new Date()) + (bad ? " - " + bad + " Quelle(n) mit Fehler" : "");
  tick();
}

buildPanels();
tick();
refresh();
setInterval(tick, 1000);
setInterval(refresh, CONFIG.refreshSeconds * 1000);
refreshWeather(true);
setInterval(() => refreshWeather(false), 60000);
</script>
</body>
</html>
